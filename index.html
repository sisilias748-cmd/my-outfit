
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my outfit ✨</title>
<style>
body{margin:0;font-family:Arial,sans-serif;color:#222;background:#fff}
header{padding:22px;text-align:center;border-bottom:1px solid #eee}
h1{margin:0}
.hero{padding:35px 20px;text-align:center;background:#f5f5f5}
.hero h2{font-size:30px}
.search{padding:20px;display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:12px;border:1px solid #ddd;border-radius:8px;flex:1;min-width:120px}
.products{padding:0 15px 25px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid #eee;border-radius:10px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover}
.card div{padding:10px}
.card h3{font-size:16px}
.card p{color:#666;font-size:13px}
.card a{display:block;background:#222;color:white;text-decoration:none;text-align:center;padding:10px;border-radius:6px;font-size:13px}
footer{text-align:center;padding:22px;background:#f5f5f5}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>my outfit ✨</h1><p>Your everyday style</p></header>
<section class="hero">
<h2>Find Your Style.</h2>
<p>Temukan inspirasi outfit favoritmu di sini.</p>
</section>
<div class="search">
<input id="search" placeholder="Cari produk..." oninput="showProducts()">
<select id="category" onchange="showProducts()">
<option>Semua</option><option>Atasan</option><option>Bawahan</option><option>Sepatu</option><option>Aksesori</option>
</select>
</div>
<main class="products" id="products"></main>
<footer>my outfit ✨ · Temukan gaya favoritmu</footer>
<script>
const items=[
["Basic Top","Atasan","https://placehold.co/400x500/f3f3f3/222?text=Basic+Top"],
["Everyday Pants","Bawahan","https://placehold.co/400x500/e8e8e8/222?text=Pants"],
["Daily Sneakers","Sepatu","https://placehold.co/400x500/f3f3f3/222?text=Sneakers"],
["Simple Bag","Aksesori","https://placehold.co/400x500/e8e8e8/222?text=Bag"]
];
function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
let c=document.getElementById("category").value;
document.getElementById("products").innerHTML=items.filter(x=>(x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q))&&(c==="Semua"||x[1]===c)).map(x=>`<article class="card"><img src="${x[2]}" alt="${x[0]}"><div><h3>${x[0]}</h3><p>${x[1]}</p><a href="https://shopee.co.id/" target="_blank">Lihat produk</a></div></article>`).join("");
}
showProducts();
</script>
</body>
</html>
